actor: Tester
bootstrap: _bootstrap.php
paths:
    tests: tests
    log: tests/_output
    output: tests/_output
    data: tests/_data
    helpers: tests/_support
    support: tests/_support
settings:
    bootstrap: _bootstrap.php
    colors: true
    memory_limit: 2048M
    error_level: "E_ALL & ~E_WARNING & ~E_STRICT & ~E_DEPRECATED & ~E_NOTICE"
