<config autoescape="on" />
<include target="header.html" />
<div cond="$XE_VALIDATOR_MESSAGE && $XE_VALIDATOR_ID == 'packageinstaller/refresh'" class="message {$XE_VALIDATOR_MESSAGE_TYPE}"><p>{$XE_VALIDATOR_MESSAGE}</p></div>
<div class="pkg-toolbar">
	<form action="./" method="post">
		<input type="hidden" name="module" value="packageinstaller" />
		<input type="hidden" name="act" value="procPackageinstallerAdminRefreshCatalog" />
		<input type="hidden" name="xe_validator_id" value="packageinstaller/refresh" />
		<input type="hidden" name="pkg_token" value="{$pkg_token}" />
		<input type="hidden" name="pkg_type" value="{$pkg_type}" />
		<input type="hidden" name="pkg_search" value="{$pkg_search}" />
		<button class="x_btn" type="submit">{$lang->pkg_refresh_catalog}</button>
	</form>
	<form action="./" method="get" class="x_input-append">
		<input type="hidden" name="module" value="admin" />
		<input type="hidden" name="act" value="dispAutoinstallAdminIndex" />
		<input cond="$pkg_type !== 'all'" type="hidden" name="type" value="{$pkg_type}" />
		<input type="search" name="search_keyword" aria-label="{$lang->pkg_search_label}" placeholder="{$lang->pkg_search_label}" value="{$pkg_search}" />
		<button class="x_btn x_btn-inverse" type="submit">{$lang->cmd_search}</button>
	</form>
</div>
<div class="autoinstall_list">
	<div loop="$pkg_rows => $pkg" class="autoinstall_list_item">
		<a class="x_thumbnail" href="{getUrl('', 'module', 'admin', 'act', 'dispAutoinstallAdminPackageDetail', 'pkg_id', $pkg['id'], 'type', $pkg_type === 'all' ? '' : $pkg_type, 'search_keyword', $pkg_search)}">
			<div class="thumb thumb-{$pkg['icon']}"><i class="xi-{$pkg['icon']}" aria-hidden="true"></i><img class="pkg-thumbnail" cond="$pkg['thumbnail_url']" src="{$pkg['thumbnail_url']}" alt="" onerror="this.hidden=true" /></div>
			<div class="info">
				<div class="package_type">{Context::getLang('pkg_type_' . $pkg['type'])} <span class="license_details">· {$pkg['license']}</span></div>
				<h3>{$pkg['title']}</h3>
				<p class="description" cond="$pkg['description']">{$pkg['description']}</p>
				<div class="meta"><span>{$pkg['author']} · {$pkg['version']}</span>
					<span class="pkg-badge badge-{$pkg['badge']}">{Context::getLang('pkg_badge_' . $pkg['badge'])}</span>
				</div>
			</div>
		</a>
	</div>
</div>
<p cond="!$pkg_rows" class="message">{$pkg_type === 'updates' ? $lang->pkg_no_updates : $lang->pkg_no_results}</p>
