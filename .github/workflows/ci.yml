name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main", "fix/php8" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        php: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4']
        include:
          - php: '8.0'
            experimental: false
            codecept_ver: '4'
          - php: '8.1'
            experimental: false
            codecept_ver: '5'
          - php: '8.2'
            experimental: false
            codecept_ver: '5'
          - php: '8.3'
            experimental: false
            codecept_ver: '5'
          - php: '8.4'
            experimental: false
            codecept_ver: '5'
          - php: '8.5'
            experimental: true
            codecept_ver: '5'
          - php: '8.6'
            experimental: true
            codecept_ver: '5'

    continue-on-error: ${{ matrix.experimental }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xe_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mysql, mysqli, pdo, pdo_mysql, mbstring, dom, gd, zip, curl
        ini-values: register_argc_argv=On
        tools: composer
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '16'

    - name: Check PHP syntax (including PHP 5.3)
      run: |
        while IFS= read -r -d '' file; do
          php -l "$file" > /dev/null || exit 1
        done < <(git ls-files -z '*.php' '*.inc' ':!:tests/**')

    - name: Install NPM dependencies
      run: |
        npm install -g grunt-cli
        npm install

    - name: Configure Composer Security Settings
      if: matrix.php >= '7.2'
      run: composer config audit.block-insecure false

    - name: Install Composer dependencies (PHP 5.4 - 7.4)
      if: matrix.php != '5.3' && !matrix.codecept_ver
      run: |
        for attempt in 1 2 3; do
          if composer install --prefer-dist --no-progress; then
            break
          fi

          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi

          echo "::warning::Composer install failed (attempt $attempt/3); retrying in $((attempt * 10)) seconds"
          sleep "$((attempt * 10))"
        done

    - name: Install Composer dependencies (PHP 8.0, Codeception 4.x)
      if: matrix.codecept_ver == '4'
      run: |
        for attempt in 1 2 3; do
          if composer require --dev \
            "codeception/codeception:^4.0" \
            "codeception/module-asserts" \
            "codeception/module-db" \
            "codeception/module-phpbrowser" \
            "codeception/module-filesystem" \
            --prefer-dist --no-progress; then
            break
          fi

          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi

          echo "::warning::Composer install failed (attempt $attempt/3); retrying in $((attempt * 10)) seconds"
          sleep "$((attempt * 10))"
        done

    - name: Install Composer dependencies (PHP 8.1+, Codeception 5.x)
      if: matrix.codecept_ver == '5'
      run: |
        for attempt in 1 2 3; do
          if composer require --dev \
            "codeception/codeception:^5.0" \
            "codeception/module-asserts" \
            "codeception/module-db" \
            "codeception/module-phpbrowser" \
            "codeception/module-filesystem" \
            --prefer-dist --no-progress; then
            break
          fi

          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi

          echo "::warning::Composer install failed (attempt $attempt/3); retrying in $((attempt * 10)) seconds"
          sleep "$((attempt * 10))"
        done

    - name: Run standalone security regressions (including PHP 5.3)
      run: php tests/security/regressions.php

    - name: Run Grunt tasks
      run: |
        grunt lint --force
        grunt minify

    - name: Prepare PHP crash diagnostics
      if: matrix.php != '5.3'
      run: |
        diagnostics_dir="$RUNNER_TEMP/php-crash-diagnostics"
        core_dir="$RUNNER_TEMP/php-cores"
        mkdir -p "$diagnostics_dir" "$core_dir"

        if ! command -v gdb >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gdb
        fi

        # Bypass the runner's crash handler and keep one core per process.
        sudo sysctl -w "kernel.core_pattern=$core_dir/core.%p"
        {
          php --version
          php --ini
          php -m
          php -r '
            foreach (get_loaded_extensions() as $extension) {
              printf("%s: %s\n", $extension, phpversion($extension));
            }
            foreach (array("opcache.enable", "opcache.enable_cli", "opcache.jit", "opcache.jit_buffer_size", "memory_limit", "max_execution_time") as $setting) {
              printf("%s=%s\n", $setting, var_export(ini_get($setting), true));
            }
          '
          cat /proc/sys/kernel/core_pattern
        } 2>&1 | tee "$diagnostics_dir/php-runtime.log"

    - name: Run Codeception
      if: matrix.php != '5.3'
      run: |
        ulimit -c unlimited
        ./vendor/bin/codecept build

        server_pid=

        stop_php_server() {
          if [ -n "$server_pid" ]; then
            kill "$server_pid" 2>/dev/null || true
            if wait "$server_pid"; then
              server_status=0
            else
              server_status=$?
            fi
            echo "PHP server PID $server_pid exited with status $server_status" >> /tmp/php_server.log
            server_pid=
          fi
        }

        trap stop_php_server EXIT
        : > /tmp/php_server.log

        for test_attempt in 1 2; do
          echo "=== Codeception attempt $test_attempt/2 ===" >> /tmp/php_server.log
          php -d log_errors=1 -d error_log=/tmp/php_server.log -S 127.0.0.1:8000 >> /tmp/php_server.log 2>&1 &
          server_pid=$!
          echo "PHP server PID $server_pid (attempt $test_attempt/2)" >> /tmp/php_server.log
          server_ready=

          for readiness_attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi

            # A partial installer run can make the app return 404 until Codeception resets it.
            if curl --silent --show-error \
              --connect-timeout 1 --max-time 2 \
              --output /dev/null http://127.0.0.1:8000/; then
              server_ready=1
              break
            fi

            sleep 1
          done

          if [ -z "$server_ready" ]; then
            echo "::warning::PHP server failed to become ready (attempt $test_attempt/2)"
            cat /tmp/php_server.log
            stop_php_server

            if [ "$test_attempt" -eq 2 ]; then
              exit 1
            fi

            sleep 2
            continue
          fi

          set +e
          ./vendor/bin/codecept run -d --fail-fast --env travis 2>&1 | tee /tmp/codeception.log "$RUNNER_TEMP/php-crash-diagnostics/codeception-attempt-$test_attempt.log"
          test_status=${PIPESTATUS[0]}
          set -e

          server_exited=
          if ! kill -0 "$server_pid" 2>/dev/null; then
            server_exited=1
          fi
          stop_php_server

          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$test_attempt" -eq 1 ] && { [ -n "$server_exited" ] || grep -Fq "cURL error 52" /tmp/codeception.log; }; then
            echo "::warning::PHP server connection was lost; restarting the server and retrying Codeception once"
            sleep 2
            continue
          fi

          exit "$test_status"
        done

    - name: Show PHP server error log
      if: always() && matrix.php != '5.3'
      run: cat /tmp/php_server.log 2>/dev/null || echo "(no php errors logged)"

    - name: Collect PHP crash backtraces
      if: always() && matrix.php != '5.3'
      run: |
        diagnostics_dir="$RUNNER_TEMP/php-crash-diagnostics"
        mkdir -p "$diagnostics_dir"
        if [ -f /tmp/php_server.log ]; then
          cp /tmp/php_server.log "$diagnostics_dir/php-server.log"
        fi

        shopt -s nullglob
        core_files=("$RUNNER_TEMP/php-cores"/core.*)
        if [ "${#core_files[@]}" -eq 0 ]; then
          echo "No PHP core dumps found." | tee "$diagnostics_dir/core-status.log"
        fi

        for core_file in "${core_files[@]}"; do
          backtrace="$diagnostics_dir/$(basename "$core_file").backtrace.log"
          echo "::group::PHP crash backtrace ($(basename "$core_file"))"
          if timeout 45s gdb --batch \
            -ex 'set pagination off' \
            -ex 'set debuginfod enabled off' \
            -ex 'info sharedlibrary' \
            -ex 'thread apply all bt full' \
            "$(readlink -f "$(command -v php)")" "$core_file" > "$backtrace" 2>&1; then
            cat "$backtrace"
          else
            cat "$backtrace"
            echo "::warning::Could not finish the PHP crash backtrace for $core_file"
          fi
          echo "::endgroup::"
        done

    - name: Upload PHP crash diagnostics
      if: always() && matrix.php != '5.3'
      uses: actions/upload-artifact@v4
      with:
        name: php-crash-diagnostics-${{ matrix.php }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/php-crash-diagnostics/
        retention-days: 7
