name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main", "fix/php8" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        php: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4']
        include:
          - php: '8.0'
            experimental: false
            codecept_ver: '4'
          # PHP 8.1+: codeception 5.x 사용
          - php: '8.1'
            experimental: false
            codecept_ver: '5'
          - php: '8.2'
            experimental: false
            codecept_ver: '5'
          - php: '8.3'
            experimental: false
            codecept_ver: '5'
          - php: '8.4'
            experimental: false
            codecept_ver: '5'
          - php: '8.5'
            experimental: true
            codecept_ver: '5'

    continue-on-error: ${{ matrix.experimental }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xe_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mysql, mysqli, pdo, pdo_mysql, mbstring, dom, gd, zip, curl
        tools: composer
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '16'

    - name: Install NPM dependencies
      run: |
        npm install -g grunt-cli
        npm install

    - name: Configure Composer Security Settings
      if: matrix.php >= '7.2'
      run: composer config audit.block-insecure false

    - name: Install Composer dependencies (PHP 5.4 - 7.4)
      if: matrix.php != '5.3' && !matrix.codecept_ver
      run: |
        for attempt in 1 2 3; do
          if composer install --prefer-dist --no-progress; then
            break
          fi

          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi

          echo "::warning::Composer install failed (attempt $attempt/3); retrying in $((attempt * 10)) seconds"
          sleep "$((attempt * 10))"
        done

    - name: Install Composer dependencies (PHP 8.0, Codeception 4.x)
      if: matrix.codecept_ver == '4'
      run: |
        for attempt in 1 2 3; do
          if composer require --dev \
            "codeception/codeception:^4.0" \
            "codeception/module-asserts" \
            "codeception/module-db" \
            "codeception/module-phpbrowser" \
            "codeception/module-filesystem" \
            --prefer-dist --no-progress; then
            break
          fi

          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi

          echo "::warning::Composer install failed (attempt $attempt/3); retrying in $((attempt * 10)) seconds"
          sleep "$((attempt * 10))"
        done

    - name: Install Composer dependencies (PHP 8.1+, Codeception 5.x)
      if: matrix.codecept_ver == '5'
      run: |
        for attempt in 1 2 3; do
          if composer require --dev \
            "codeception/codeception:^5.0" \
            "codeception/module-asserts" \
            "codeception/module-db" \
            "codeception/module-phpbrowser" \
            "codeception/module-filesystem" \
            --prefer-dist --no-progress; then
            break
          fi

          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi

          echo "::warning::Composer install failed (attempt $attempt/3); retrying in $((attempt * 10)) seconds"
          sleep "$((attempt * 10))"
        done

    - name: Run Grunt tasks
      run: |
        grunt lint --force
        grunt minify

    - name: Run Codeception
      if: matrix.php != '5.3'
      run: |
        ./vendor/bin/codecept build

        server_pid=

        stop_php_server() {
          if [ -n "$server_pid" ]; then
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            server_pid=
          fi
        }

        trap stop_php_server EXIT
        : > /tmp/php_server.log

        for test_attempt in 1 2; do
          echo "=== Codeception attempt $test_attempt/2 ===" >> /tmp/php_server.log
          php -d log_errors=1 -d error_log=/tmp/php_server.log -S 127.0.0.1:8000 >> /tmp/php_server.log 2>&1 &
          server_pid=$!
          server_ready=

          for readiness_attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi

            if curl --fail --silent \
              --connect-timeout 1 --max-time 2 \
              --output /dev/null http://127.0.0.1:8000/; then
              server_ready=1
              break
            fi

            sleep 1
          done

          if [ -z "$server_ready" ]; then
            echo "::warning::PHP server failed to become ready (attempt $test_attempt/2)"
            cat /tmp/php_server.log
            stop_php_server

            if [ "$test_attempt" -eq 2 ]; then
              exit 1
            fi

            sleep 2
            continue
          fi

          set +e
          ./vendor/bin/codecept run -d --fail-fast --env travis 2>&1 | tee /tmp/codeception.log
          test_status=${PIPESTATUS[0]}
          set -e

          server_exited=
          if ! kill -0 "$server_pid" 2>/dev/null; then
            server_exited=1
          fi
          stop_php_server

          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$test_attempt" -eq 1 ] && { [ -n "$server_exited" ] || grep -Fq "cURL error 52" /tmp/codeception.log; }; then
            echo "::warning::PHP server connection was lost; restarting the server and retrying Codeception once"
            sleep 2
            continue
          fi

          exit "$test_status"
        done

    - name: Show PHP server error log
      if: always() && matrix.php != '5.3'
      run: cat /tmp/php_server.log 2>/dev/null || echo "(no php errors logged)"
