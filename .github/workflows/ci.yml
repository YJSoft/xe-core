name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main", "fix/php8" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        php: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4']
        include:
          - php: '8.0'
            experimental: false
            codecept_ver: '4'
          # PHP 8.1+: codeception 5.x 사용
          - php: '8.1'
            experimental: false
            codecept_ver: '5'
          - php: '8.2'
            experimental: false
            codecept_ver: '5'
          - php: '8.3'
            experimental: false
            codecept_ver: '5'
          - php: '8.4'
            experimental: false
            codecept_ver: '5'
          - php: '8.5'
            experimental: true
            codecept_ver: '5'

    continue-on-error: ${{ matrix.experimental }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xe_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mysql, mysqli, pdo, pdo_mysql, mbstring, dom, gd, zip, curl
        tools: composer
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '16'

    - name: Install NPM dependencies
      run: |
        npm install -g grunt-cli
        npm install

    - name: Configure Composer Security Settings
      if: matrix.php >= '7.2'
      run: composer config audit.block-insecure false

    - name: Install Composer dependencies (PHP 5.4 - 7.4)
      if: matrix.php != '5.3' && !matrix.codecept_ver
      run: composer install --prefer-dist --no-progress

    - name: Install Composer dependencies (PHP 8.0, Codeception 4.x)
      if: matrix.codecept_ver == '4'
      run: |
        composer require --dev \
          "codeception/codeception:^4.0" \
          "codeception/module-asserts" \
          "codeception/module-db" \
          "codeception/module-phpbrowser" \
          "codeception/module-filesystem" \
          --prefer-dist --no-progress

    - name: Install Composer dependencies (PHP 8.1+, Codeception 5.x)
      if: matrix.codecept_ver == '5'
      run: |
        composer require --dev \
          "codeception/codeception:^5.0" \
          "codeception/module-asserts" \
          "codeception/module-db" \
          "codeception/module-phpbrowser" \
          "codeception/module-filesystem" \
          --prefer-dist --no-progress

    - name: Start PHP Server
      if: matrix.php != '5.3'
      run: |
        php -S 127.0.0.1:8000 -d log_errors=1 -d error_log=/tmp/php_server.log &
        sleep 3

    - name: Run Grunt tasks
      run: |
        grunt lint --force
        grunt minify

    - name: Run Codeception
      if: matrix.php != '5.3'
      run: |
        ./vendor/bin/codecept build
        ./vendor/bin/codecept run -d --fail-fast --env travis

    - name: Show PHP server error log
      if: always() && matrix.php != '5.3'
      run: cat /tmp/php_server.log 2>/dev/null || echo "(no php errors logged)"
