name: Update release news

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      valid: ${{ steps.tag.outputs.valid }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          tag = event['release']['tag_name']
          valid = re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', tag) is not None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'valid={str(valid).lower()}\n')
          if not valid:
              print(f'Skipping non-version release tag: {tag!r}')
          PY

  update:
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    permissions:
      contents: write
      pages: write
    concurrency:
      group: update-release-news
      cancel-in-progress: false

    steps:
      - name: Checkout release news branch
        uses: actions/checkout@v6
        with:
          ref: release-news

      - name: Update release.xml
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          release = event['release']
          version = release['tag_name']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              print('Skipping non-version release tag.')
              raise SystemExit(0)

          path = Path('release.xml')
          parser = ET.XMLParser(target=ET.TreeBuilder(insert_comments=True))
          tree = ET.parse(path, parser=parser)
          root = tree.getroot()
          if root.tag != 'zbxe_news':
              raise SystemExit('Unexpected release.xml root element.')

          # A rerun of an older release must not downgrade the latest version.
          current = root.get('released_version', '')
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', current):
              if tuple(map(int, version.split('.'))) < tuple(map(int, current.split('.'))):
                  print(f'Skipping older release {version}; latest is {current}.')
                  raise SystemExit(0)

          # Use publication time so reruns keep the same date (Korea Standard Time).
          published_at = datetime.fromisoformat(release['published_at'].replace('Z', '+00:00'))
          date = published_at.astimezone(ZoneInfo('Asia/Seoul')).strftime('%Y%m%d%H%M%S')
          url = release['html_url']
          title = f'XE Core ver. {version}'

          # Replace an existing entry for the same version instead of duplicating it.
          for item in root.findall('item'):
              if item.get('url') == url or item.text == title:
                  root.remove(item)

          item = ET.Element('item', {'url': url, 'date': date})
          item.text = title
          item.tail = root.text or '\n    '
          root.insert(0, item)
          root.set('released_version', version)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          with path.open('ab') as output:
              output.write(b'\n')
          PY

      - name: Commit and push release news
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- release.xml; then
            echo 'Release news is already up to date.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.xml
          git commit -m 'Update release news'
          git push origin HEAD:release-news
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # Pages must use "Deploy from a branch": release-news / (root).
      # GITHUB_TOKEN pushes do not trigger Pages builds automatically.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  # Runs only when release.xml was actually updated and pushed. A failed Pages
  # build request does not block it, because the release news is already pushed.
  refresh-site:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refresh xe-patches.c01.kr release cache
        env:
          REFRESH_URL: ${{ secrets.XE_PATCHES_REFRESH_URL }}
          REFRESH_TOKEN: ${{ secrets.XE_PATCHES_REFRESH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [ -z "$REFRESH_URL" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo 'Refresh secrets are not set; skipping.'
            exit 0
          fi
          # GitHub may list the new release a little later than the event; retry on 409
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $REFRESH_TOKEN" \
              --data-urlencode "tag=$TAG" \
              --max-time 30 "$REFRESH_URL") || status=000
            cat response.json 2>/dev/null; echo
            case "$status" in
              200) echo "Site cache refreshed for $TAG."; exit 0 ;;
              409|502|000) echo "Attempt $attempt: HTTP $status, retrying in 20s"; sleep 20 ;;
              *) echo "::error::Refresh failed with HTTP $status"; exit 1 ;;
            esac
          done
          echo '::error::The site did not see the new release in time.'
          exit 1
